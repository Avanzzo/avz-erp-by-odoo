[options]
; Credentials and connection details are passed to Odoo by docker-compose.
addons_path = /opt/odoo/odoo/addons,/opt/odoo/addons
data_dir = /var/lib/odoo
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
; This stack is intended for local development. Enable proxy_mode behind a trusted proxy.
proxy_mode = False
workers = 0
log_level = info

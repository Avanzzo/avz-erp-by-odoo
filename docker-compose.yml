services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command:
      - --config=/etc/odoo/odoo.conf
      - --db_host=db
      - --db_port=5432
      - --db_user=odoo
      - --db_password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - --admin-passwd=${ODOO_MASTER_PASSWORD:?Set ODOO_MASTER_PASSWORD in .env}
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_GEVENT_PORT:-8072}:8072"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./docker/odoo.conf:/etc/odoo/odoo.conf:ro
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  odoo-data:
